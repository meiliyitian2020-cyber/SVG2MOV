name: Build and release Windows
on:
  push:
    branches: [main, 'release/**']
    paths:
      - package.json
      - package-lock.json
      - app/**
      - scripts/**
      - tests/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Electron
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests
        run: npm test
      - name: Prepare verified FFmpeg
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1
      - name: Windows conversion smoke test
        run: node scripts/smoke-export.cjs
      - name: Window layout, completion toast and queue checks
        run: node scripts/ui-check.cjs
      - name: Build portable EXE
        run: npm run build:win
      - name: Verify Chinese executable metadata and icon
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $inner = Join-Path $pkg.build.directories.output "win-unpacked/SVGA 转 MOV.exe"
          if (!(Test-Path $inner)) { throw "Chinese executable name is missing" }
          $info = (Get-Item $inner).VersionInfo
          if ($info.ProductName -ne 'SVGA 转 MOV') { throw "Product name metadata mismatch: $($info.ProductName)" }
          if (!$info.FileVersion.StartsWith($pkg.version)) { throw "File version mismatch: $($info.FileVersion)" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($inner)
          if ($null -eq $icon) { throw 'Application icon is missing' }
          $icon.Dispose()
          Write-Host "Product: $($info.ProductName); Version: $($info.FileVersion); icon present."
          Write-Host "Signing status: $((Get-AuthenticodeSignature $inner).Status). This build does not claim a trusted code signature."
      - name: Prepare release files
        id: package
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $out = $pkg.build.directories.output
          $exe = Join-Path $out ($pkg.build.portable.artifactName.Replace('${version}', $version))
          $zip = Join-Path $out "SVGA转MOV-$version.zip"
          $source = Join-Path $out "SVG2MOV-$version-source.zip"
          if (!(Test-Path $exe)) { throw "Expected EXE is missing: $exe" }
          Compress-Archive -Path $exe -DestinationPath $zip
          git archive --format=zip --output=$source HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @($exe, $zip, $source) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content -Encoding ascii (Join-Path $out 'SHA256SUMS.txt')
          "version=$version" >> $env:GITHUB_OUTPUT
          "out=$out" >> $env:GITHUB_OUTPUT
      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SVG2MOV-v${{ steps.package.outputs.version }}-windows
          path: |
            ${{ steps.package.outputs.out }}/*.exe
            ${{ steps.package.outputs.out }}/*.zip
            ${{ steps.package.outputs.out }}/SHA256SUMS.txt
          retention-days: 90
      - name: Retain UI verification captures
        uses: actions/upload-artifact@v4
        with:
          name: SVG2MOV-v${{ steps.package.outputs.version }}-ui-checks
          path: .smoke-output/ui/*.png
          retention-days: 30
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ steps.package.outputs.version }}'
          $out = '${{ steps.package.outputs.out }}'
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; build artifacts are available in this Actions run."
            exit 0
          }
          $assets = @(Get-ChildItem $out -File | Where-Object { $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $env:GITHUB_SHA --title "SVGA 转 MOV $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
