<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'">
<title>SVGA 转 MOV</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
 <header class="header">
  <img class="app-icon" src="assets/icon.svg" width="38" height="38" alt="">
  <div class="brand"><h1>SVGA 转 MOV</h1><span>透明动画导出</span></div>
  <span class="version" id="version">1.3.0</span>
 </header>
 <section id="drop" class="drop-zone" aria-label="SVGA 文件拖放区域">
  <svg class="drop-icon" width="30" height="32" viewBox="0 0 30 32" fill="none" aria-hidden="true"><path d="M7 2h10l7 7v19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M16 3v7h7M10 20h10m-5-5v10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  <div class="drop-copy"><h2>拖入 SVGA，自动导出</h2><p>支持批量 · 保留透明通道和内嵌音频</p></div>
  <button id="pick" class="primary">选择文件</button>
 </section>
 <details id="settings" class="settings">
  <summary><span class="settings-title">导出设置</span><span id="settingSummary" class="summary-text">原尺寸 · 原帧率 · PNG 无损 · 四周 +200 px</span><svg class="chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></summary>
  <div class="settings-body">
   <div class="settings-grid">
    <label class="field"><span>内容尺寸</span><select id="scale"><option value="1">原始尺寸</option><option value="0.5">0.5 倍</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option><option value="3">3 倍</option><option value="4">4 倍</option></select></label>
    <div class="field"><label for="fpsMode">帧率</label><div class="field-control"><select id="fpsMode"><option value="source">沿用原帧率</option><option value="custom">自定义…</option></select><label class="custom-value" id="fpsCustom" hidden><input id="fps" type="number" min="1" max="120" step="0.001" value="30" aria-label="自定义帧率"><span>fps</span></label></div></div>
    <label class="field"><span>视频编码</span><select id="codec"><option value="png">PNG 无损</option><option value="prores">ProRes 4444</option></select></label>
    <div class="field" id="compressionField"><label for="compressionMode">PNG 压缩方式 <span class="field-tag">全部无损</span></label><div class="field-control"><select id="compressionMode"><option value="standard">标准压缩（默认）</option><option value="fast">快速导出</option><option value="small">更小文件</option><option value="custom">自定义…</option></select><label class="custom-value" id="compressionCustom" hidden><input id="compression" type="number" min="0" max="9" step="1" value="6" aria-label="PNG 自定义压缩等级"><span>0–9</span></label></div><small id="compressionHint">速度与体积折中，不改变画质。</small></div>
    <div class="field"><label for="loopsMode">播放遍数</label><div class="field-control"><select id="loopsMode"><option value="1">1 遍（不重复）</option><option value="2">2 遍</option><option value="3">3 遍</option><option value="5">5 遍</option><option value="custom">自定义…</option></select><label class="custom-value" id="loopsCustom" hidden><input id="loops" type="number" min="1" max="100" step="1" value="1" aria-label="自定义播放遍数"><span>遍</span></label></div><small>画面和声音一起重复，导出时长随之增加。</small></div>
    <div class="field"><label for="padding">每侧扩充</label><div class="input-unit"><input id="padding" type="number" min="0" max="4096" step="1" value="200"><span>px</span></div><small>扩大渲染区域，主体不缩放；0 为关闭。</small></div>
   </div>
   <div class="settings-foot"><span>PNG 压缩影响速度和文件大小，所有等级均为无损。</span><button id="restore" class="text-button">恢复默认设置</button></div>
  </div>
 </details>
 <section class="output-row" aria-label="输出目录"><label for="outputDir">保存到</label><input id="outputDir" readonly placeholder="各 SVGA 文件所在目录" title="默认保存到各个 SVGA 的原目录"><button id="resetDir" class="text-button" hidden>同源目录</button><button id="folder" class="secondary">更改</button></section>
 <div id="notice" class="notice" role="status" hidden></div>
 <section class="queue-section" aria-label="导出队列">
  <div class="queue-toolbar"><h2>导出队列 <span id="queueCount"></span></h2><div class="queue-actions"><button id="cancel" class="text-button" disabled>取消导出</button><button id="clear" class="text-button" title="清除列表和等待任务，不删除任何源文件或已导出文件；正在导出的任务会保留。" disabled>清空队列</button></div></div>
  <div id="queue" class="queue-list" tabindex="0"><div id="empty" class="empty">文件加入后，进度会显示在这里</div></div>
 </section>
 <footer><span id="status">文件仅在本机处理</span><span>清空队列不删除文件</span></footer>
</main>
<aside id="toast" class="toast" role="status" aria-live="polite" hidden><span class="toast-mark" aria-hidden="true">✓</span><div class="toast-content"><strong id="toastTitle">导出完成</strong><p id="toastMessage"></p><p id="toastPath" class="toast-path"></p><button id="toastOpen" class="text-button">打开文件夹</button></div><div id="toastTimer" class="toast-timer"></div></aside>
<script src="ui.js"></script>
</body>
</html>
