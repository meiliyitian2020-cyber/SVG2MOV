<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"><title>SVGA 转 MOV</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#20242d;font:14px 'Segoe UI','Microsoft YaHei',sans-serif;padding:28px 34px}h1{font-size:25px;margin:0 0 8px}p{color:#687182;line-height:1.6;margin:4px 0 18px}.panel{background:white;border:1px solid #e1e4ea;border-radius:12px;padding:20px;margin-top:18px}#drop{border:2px dashed #bac5d8;text-align:center;padding:25px;border-radius:10px;cursor:pointer;background:#fafbfe}#drop.over{border-color:#3569d7;background:#edf3ff}#drop strong{display:block;font-size:18px;margin-bottom:8px}button,select,input{font:inherit;border:1px solid #ced4de;border-radius:6px;padding:8px 10px;background:white;color:#273041}button{cursor:pointer}button.primary{background:#3265d3;color:white;border-color:#3265d3}button:hover{filter:brightness(.96)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}label{display:flex;align-items:center;justify-content:space-between;gap:12px}label select,label input{width:165px}input[type=number]{width:165px}.output{margin-top:16px;display:flex;gap:8px;align-items:center}.output input{flex:1;min-width:0}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:15px;margin:0 0 16px}small{color:#7a8290}#queue{max-height:230px;overflow-y:auto}.item{border-top:1px solid #edf0f3;padding:13px 0}.filename{font-weight:600;overflow-wrap:anywhere}.detail{font-size:12px;color:#6c7686;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%;height:7px;margin-top:8px;accent-color:#3265d3}.done{color:#25845b}.error{color:#bd3e3e}#notice{color:#3265d3;min-height:20px;margin:10px 0 0;font-size:12px}#restore{font-size:12px}#status{font-size:12px;color:#758091}
</style></head><body><h1>SVGA 转 MOV</h1><p>保留透明通道 · 逐帧导出 · 本地处理</p>
<div id="drop"><strong>将 SVGA 文件拖到这里</strong><span>支持批量拖入，自动开始导出</span><br><button id="pick" class="primary" style="margin-top:15px">选择 SVGA 文件</button></div>
<div class="panel"><div class="bar"><h2>导出设置</h2><button id="restore">恢复默认</button></div><div class="grid">
<label>分辨率<select id="scale"><option value="0.5">0.5 倍</option><option value="1">原分辨率</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option><option value="3">3 倍</option><option value="4">4 倍</option></select></label>
<label>帧率<input id="fps" type="number" min="0" max="120" step="0.001" value="0" title="0 表示使用 SVGA 原帧率"></label>
<label>视频编码<select id="codec"><option value="png">PNG 无损（默认）</option><option value="prores">ProRes 4444</option></select></label>
<label>PNG 压缩级别<input id="compression" type="number" min="0" max="9" value="6"></label>
<label>四周扩充（px）<input id="padding" type="number" min="0" max="4096" step="1" value="200" title="每一侧增加的输出像素；设为0恢复原边界"></label><small>默认四周各加 200 px，重新渲染画布外内容，主体不缩放。设为 0 关闭。</small>
<label>循环次数<input id="loops" type="number" min="1" max="100" value="1"></label><small>帧率 0 = 原帧率；PNG 各压缩级别均无损。</small>
</div><div class="output"><span>输出目录</span><input id="outputDir" placeholder="默认：各 SVGA 文件所在目录" readonly><button id="folder">更改</button><button id="resetDir">默认</button></div><div id="notice"></div><small>命名：原文件名_mov导出.mov。同名自动加序号。SVGA 含内嵌音频时自动保留，并与画面同步。</small></div>
<div class="panel"><div class="bar"><h2>导出队列 <span id="status">等待文件</span></h2><button id="cancel">取消全部</button></div><div id="queue"><small id="empty">暂无任务</small></div></div><script src="ui.js"></script></body></html>
